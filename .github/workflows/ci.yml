name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Test
        run: cargo test --all-targets --features python
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Dependency audit
        run: cargo audit

  python:
    name: Python (core, ai, desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest numpy pandas scikit-learn onnx onnxruntime
      - name: Build and install the shared core extension
        run: |
          maturin build --release --features python --out dist
          python -m pip install dist/*.whl
        working-directory: core/rust
      - name: Tests (shared core + golden vectors + model parity)
        run: pytest -q core/python/tests ai/tests apps/desktop/tests
      - name: Verify the ONNX model checksum
        run: |
          cd shared/model
          sha256sum -c SHA256SUMS

  android:
    name: Android (lint, unit tests, assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Install Android SDK platform and NDK
        run: sdkmanager "platforms;android-37" "ndk;27.0.12077973"
      - name: Build the shared native core for Android
        run: ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973" scripts/build_android_core.sh
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
        working-directory: apps/android
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
        working-directory: apps/android
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: apps/android

  security:
    name: Secret + dependency scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r apps/desktop/requirements.txt || true
      - name: OSV scan
        uses: google/osv-scanner-action/osv-scanner-action@v1
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=core/rust/Cargo.lock
