name: Release (manual)

# Releases are never produced automatically. A maintainer starts this workflow
# by hand and chooses whether to publish the draft. Nothing is pushed to a
# store; the GitHub Release is created as a *draft* for human review.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create (e.g. v2.1.0). Must match shared/version.json."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify version matches shared/version.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          shared=$(python -c "import json;print(json.load(open('shared/version.json'))['version'])")
          tag="${{ inputs.version }}"
          tag="${tag#v}"
          if [ "$shared" != "$tag" ]; then
            echo "error: input tag '${{ inputs.version }}' != shared/version.json '$shared'" >&2
            exit 1
          fi
          echo "version=$shared" >> "$GITHUB_OUTPUT"

  android-release:
    name: Signed Android APK + AAB
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Use the preinstalled Android SDK on ubuntu-latest instead of
      # android-actions/setup-android, which can fail bootstrapping the
      # deprecated "tools" package with newer cmdline-tools.
      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Install Android SDK platform and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort | tail -n1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
      - name: Build the shared native core for Android
        run: ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973" bash scripts/build_android_core.sh
      - name: Materialise the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "error: ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > apps/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build signed release artifacts
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Collect artifacts + checksums
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          cp apps/android/app/build/outputs/bundle/release/*.aab dist/ 2>/dev/null || true
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suras-android-${{ needs.verify-version.outputs.version }}
          path: dist/
          if-no-files-found: error

  draft-release:
    name: Draft GitHub Release
    needs: [verify-version, android-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: suras-android-${{ needs.verify-version.outputs.version }}
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --draft \
            --title "SURAS v${VERSION}" \
            --notes "Research prototype build. See CHANGELOG.md. For research and decision support only." \
            dist/*
